<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#047857" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#primaryGrad)" />

  <!-- Inner Soft Pattern Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Central Shopping Cart & Grocery & Price Tracker Graphic -->
  <g transform="translate(68, 80)">
    <!-- Grocery Leaf Accent on top left of cart -->
    <path d="M 80 50 C 60 20, 110 0, 140 20 C 145 50, 110 70, 80 50 Z" fill="#a7f3d0" />
    <path d="M 90 45 Q 115 30 135 22" stroke="#065f46" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Shopping Cart Wireframe -->
    <path d="M 30 40 L 80 40 L 130 220 L 305 220 L 335 95 L 98 95" 
          fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Cart Grid Lines -->
    <path d="M 155 98 L 175 218" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 215 98 L 225 218" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 275 98 L 275 218" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 115 155 L 320 155" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- Wheels -->
    <circle cx="150" cy="275" r="26" fill="#ffffff" />
    <circle cx="150" cy="275" r="10" fill="#047857" />
    <circle cx="285" cy="275" r="26" fill="#ffffff" />
    <circle cx="285" cy="275" r="10" fill="#047857" />

    <!-- Price Tracker Trend Chart Line badge (floating top right) -->
    <g transform="translate(190, 10)">
      <rect x="0" y="0" width="165" height="95" rx="20" fill="#ffffff" filter="url(#cardShadow)" />
      <!-- Mini Chart Graph -->
      <polyline points="20,70 55,50 95,65 140,25" fill="none" stroke="#059669" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <polygon points="140,25 125,25 140,40" fill="#059669" />
      <circle cx="55" cy="50" r="5" fill="#10b981" />
      <circle cx="95" cy="65" r="5" fill="#10b981" />
      <circle cx="140" cy="25" r="6" fill="#047857" />
    </g>
  </g>
</svg>
